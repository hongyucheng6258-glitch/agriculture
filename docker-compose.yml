version: '3.8'

services:
 backend:
 build:
 context: ./backend
 dockerfile: Dockerfile
 container_name: aquaculture-backend
 ports:
 - \8080:8080\
 volumes:
 - ./data:/app/data
 environment:
 - TZ=Asia/Shanghai
 restart: unless-stopped
 networks:
 - aquaculture-network

 frontend:
 image: nginx:alpine
 container_name: aquaculture-frontend
 ports:
 - \80:80\
 volumes:
 - ./frontend/dist:/usr/share/nginx/html
 - ./nginx.conf:/etc/nginx/conf.d/default.conf
 depends_on:
 - backend
 restart: unless-stopped
 networks:
 - aquaculture-network

networks:
 aquaculture-network:
 driver: bridge
